# =========================================================
# Bambu Lab P1S status display
#
# Paste this into a new device in the ESPHome dashboard,
# edit the substitutions below, and install. Everything
# else is pulled from GitHub at the pinned release tag.
# See README.md for where each value comes from.
# =========================================================

substitutions:
  device_name: bambulab-p1s-display
  friendly_name: Bambu Lab P1S Display
  printer_title: Bambu Lab P1S

  # Prefix of this printer's Home Assistant entities.
  # Example: sensor.p1s_print_status -> entity_prefix: p1s
  entity_prefix: p1s

  # Home Assistant address as seen from the display.
  # Give the Home Assistant host a DHCP reservation.
  ha_base_url: http://192.168.1.10:8123

  # Secrets live in your ESPHome secrets.yaml.
  # Use a different API key for each display.
  api_encryption_key: !secret p1s_api_key
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

packages:
  base: github://jsheheane/CYD-3d-Printer-Status/packages/base.yaml@v1.0.0
  hardware: github://jsheheane/CYD-3d-Printer-Status/packages/hardware/cyd-2432s028-9342.yaml@v1.0.0
  ui: github://jsheheane/CYD-3d-Printer-Status/packages/ui.yaml@v1.0.0
  backend: github://jsheheane/CYD-3d-Printer-Status/packages/backends/bambulab.yaml@v1.0.0
